
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My E-book Store - Admin</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #f4f0ff;
  color: #241747;
}
.container {
  max-width: 550px;
  margin: auto;
}
header {
  background: #39256f;
  color: white;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 18px;
}
header h1 {
  margin: 0 0 8px;
}
.panel {
  background: white;
  padding: 18px;
  border-radius: 14px;
  margin-bottom: 18px;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
}
input, textarea, button {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}
textarea {
  min-height: 90px;
  resize: vertical;
}
button {
  border: none;
  background: #39256f;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
}
.hint {
  color: #666;
  font-size: 13px;
}
#message {
  overflow-wrap: anywhere;
}
.product {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 14px;
  margin-top: 14px;
  overflow-wrap: anywhere;
}
.product img {
  width: 120px;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
}
.product h3 {
  margin-bottom: 5px;
}
.delete {
  background: #b42335;
}
.pdf-link {
  display: inline-block;
  margin: 10px 0;
  color: #39256f;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>📚 My E-book Store</h1>
  <p>Admin Panel — Add Digital Products</p>
</header>

<section class="panel">
  <h2>Add New Product</h2>

  <form id="productForm">
    <label for="name">Product Name</label>
    <input id="name" required
      placeholder="Top 10 AI Tools for Students">

    <label for="description">Description</label>
    <textarea id="description" required
      placeholder="Write about your e-book"></textarea>

    <label for="price">Price (₹)</label>
    <input id="price" type="number"
      min="1" step="1" required placeholder="99">

    <label for="cover">Cover Image</label>
    <input id="cover" type="file"
      accept="image/*" required>
    <p class="hint">Maximum cover size: 2 MB</p>

    <label for="pdf">PDF File</label>
    <input id="pdf" type="file"
      accept=".pdf,application/pdf" required>
    <p class="hint">Maximum PDF size: 5 MB</p>

    <button id="addButton" type="submit">
      Add Product
    </button>
  </form>

  <p id="message" role="status"></p>
</section>

<section class="panel">
  <h2>My Products</h2>
  <div id="products"></div>
</section>

</div>

<script>
const STORAGE_KEY = "myEbookProducts_v2";
const MAX_PDF = 5 * 1024 * 1024;
const MAX_COVER = 2 * 1024 * 1024;

const form = document.getElementById("productForm");
const message = document.getElementById("message");
const addButton = document.getElementById("addButton");
const productsArea = document.getElementById("products");

function getProducts() {
  try {
    return JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );
  } catch (error) {
    return [];
  }
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(
      new Error("File could not be read")
    );

    reader.readAsDataURL(file);
  });
}

function showProducts() {
  productsArea.replaceChildren();

  const products = getProducts();

  if (products.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "No products added yet.";
    productsArea.appendChild(empty);
    return;
  }

  products.forEach((product) => {
    const card = document.createElement("article");
    card.className = "product";

    const image = document.createElement("img");
    image.src = product.cover;
    image.alt = product.name;

    const title = document.createElement("h3");
    title.textContent = product.name;

    const description = document.createElement("p");
    description.textContent = product.description;

    const price = document.createElement("strong");
    price.textContent = "₹" + product.price;

    const pdfLink = document.createElement("a");
    pdfLink.className = "pdf-link";
    pdfLink.href = product.pdf;
    pdfLink.download = product.pdfName;
    pdfLink.textContent = "Open / Download PDF";

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete Product";

    deleteButton.addEventListener("click", () => {
      if (!confirm("Delete this product?")) return;

      const updated = getProducts().filter(
        item => item.id !== product.id
      );

      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(updated)
        );
        showProducts();
        message.textContent = "Product deleted.";
      } catch (error) {
        message.textContent = "Could not update storage.";
      }
    });

    card.append(
      image, title, description, price,
      document.createElement("br"),
      pdfLink, deleteButton
    );

    productsArea.appendChild(card);
  });
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name")
    .value.trim();
  const description = document.getElementById("description")
    .value.trim();
  const price = Number(document.getElementById("price").value);
  const coverFile = document.getElementById("cover").files[0];
  const pdfFile = document.getElementById("pdf").files[0];

  if (!name || !description || !Number.isFinite(price) ||
      price < 1 || !coverFile || !pdfFile) {
    message.textContent = "Please complete all fields.";
    return;
  }

  if (!coverFile.type.startsWith("image/")) {
    message.textContent = "Choose a valid cover image.";
    return;
  }

  if (pdfFile.type !== "application/pdf" &&
      !pdfFile.name.toLowerCase().endsWith(".pdf")) {
    message.textContent = "Choose a PDF file.";
    return;
  }

  if (coverFile.size > MAX_COVER) {
    message.textContent = "Cover image must be under 2 MB.";
    return;
  }

  if (pdfFile.size > MAX_PDF) {
    message.textContent = "PDF must be under 5 MB.";
    return;
  }

  addButton.disabled = true;
  message.textContent = "Saving product...";

  try {
    const product = {
      id: Date.now().toString(),
      name,
      description,
      price,
      cover: await readFile(coverFile),
      pdf: await readFile(pdfFile),
      pdfName: pdfFile.name
    };

    const products = getProducts();
    products.push(product);

    // Browser storage has its own quota.
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(products)
    );

    form.reset();
    message.textContent =
      "Product added successfully on this browser!";
    showProducts();

  } catch (error) {
    message.textContent =
      "Storage full or unavailable. Try smaller files.";
  } finally {
    addButton.disabled = false;
  }
});

showProducts();
</script>
</body>
</html>
